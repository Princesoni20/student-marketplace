services:
  postgres:
    image: postgres:18
    container_name: student-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_marketplace
      POSTGRES_USER: marketplace_user
      POSTGRES_PASSWORD: marketplace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U marketplace_user -d student_marketplace"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - student-marketplace-network

  redis:
    image: redis:7-alpine
    container_name: student-marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - student-marketplace-network

volumes:
  postgres_data:
  redis_data:

networks:
  student-marketplace-network:
    driver: bridge
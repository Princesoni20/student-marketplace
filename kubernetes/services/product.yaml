apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: student-marketplace
spec:
  selector:
    app: product-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: student-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: studentmarketplace-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "5001"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-marketplace-secret
                  key: DB_PASSWORD

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: REDIS_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: student-marketplace
spec:
  selector:
    app: auth-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: student-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: studentmarketplace-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "5002"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: student-marketplace-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-marketplace-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-marketplace-secret
                  key: JWT_SECRET

            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: student-marketplace-secret
                  key: JWT_EXPIRES_IN

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
